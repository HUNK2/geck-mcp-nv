name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      # One OS failing must not cancel the others: the Windows job is the exit gate's (PLAN-3 S7).
      fail-fast: false
      matrix:
        # Windows only (decision D5).
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    # The engine tests drive a fake host over a pipe; a stalled host must fail the job, not hold it for 6 hours.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock.txt
      # the naming extra, read from pyproject.toml: fnv_engine_get's purity check and the oracle tests need capstone
      - name: Install the naming extra
        run: python -c "import subprocess, sys, tomllib; extra = tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['naming']; sys.exit(subprocess.call([sys.executable, '-m', 'pip', 'install', *extra]))"
      # Lint: the rules in pyproject.toml [tool.ruff] (errors that break code: syntax, undefined names)
      - name: Lint
        run: |
          python -m pip install "ruff==0.8.6"
          python -m ruff check .
      - name: Prepare pinned Zig for native companion tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path state/zig-ci | Out-Null
          Invoke-WebRequest -Uri https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip -OutFile state/zig-ci/zig.zip
          $archiveHash = (Get-FileHash state/zig-ci/zig.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne '554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c') { throw 'Zig archive hash mismatch' }
          Expand-Archive -LiteralPath state/zig-ci/zig.zip -DestinationPath state/zig-ci
      # On Windows the whole suite runs with Zig, so the engine companion's C tests run too (PLAN-3 S0.3). The runner
      # prints a skip summary and fails the job if the engine tests were skipped (release plan M13).
      - run: python tests/ci_run.py --require-engine
        env:
          PYTHONPATH: .
          GECK_MCP_ZIG: ${{ runner.os == 'Windows' && format('{0}\bridge\state\zig-ci\zig-x86_64-windows-0.14.1\zig.exe', github.workspace) || '' }}
      - run: python -m unittest discover -s . -p test_esp_check.py -v
