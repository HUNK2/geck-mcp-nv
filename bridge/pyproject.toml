[project]
name = "geck-bridge-mcp"
version = "0.4.0"
description = "Project-scoped Model Context Protocol tools for Fallout New Vegas GECK"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "pillow==12.3.0", "numpy==2.5.3"]

[project.optional-dependencies]
# fnv_probe.py: the probe planner and caller decoding (fnv_probe / fnv_atlas)
naming = ["capstone==5.0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
