[project]
name = "fnv-mcp"
# 0.5.0-beta.1 (decision D7), in its normalised Python form
version = "0.5.0b1"
description = "MCP tools for Fallout: New Vegas: the running game, the engine and the GECK"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "pillow==12.3.0", "numpy==2.5.3"]

[project.optional-dependencies]
# fnv_probe.py: the probe planner and caller decoding (fnv_probe / fnv_atlas)
naming = ["capstone==5.0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
